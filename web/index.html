<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RenderModule</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><header><strong>RenderModule</strong> <span id="connection">Disconnected</span> <span id="lease">View only</span> <span id="diagnostics"></span><button id="reconnect">Reconnect</button><button id="play" hidden>Start video</button><form id="login"><label>Token <input id="token" type="password" autocomplete="off" maxlength="128"></label><button>Sign in</button></form></header>
<main id="display"><canvas id="picture"></canvas><video id="video" autoplay playsinline muted hidden></video><div id="input" tabindex="0" role="application" aria-label="Remote RenderModule input"></div><textarea id="text" tabindex="-1" aria-label="Remote committed text" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea></main>
<footer><span id="transport">Connecting</span> · Input over WebSocket · Click the image to control; right-drag orbits, middle-drag pans.</footer></body></html>
